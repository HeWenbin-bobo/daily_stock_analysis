# ===================================
# A股自选股智能分析系统 - Docker Compose
# ===================================
#
# 使用方式:
#   全部启动: docker compose -f ./docker/docker-compose.yml up -d
#             （同时启动定时分析 analyzer 与 Web/API server）
#   仅定时任务: docker compose -f ./docker/docker-compose.yml up -d analyzer
#   仅 Web/API: docker compose -f ./docker/docker-compose.yml up -d server
#
# 注意：不带服务名时 Compose 会启动**全部**服务，两个容器共享同一个
# data/ 卷与 SQLite。定时分析由 scheduled_analysis_claims 表去重，重复
# 触发不会产生重复报告，但 analyzer 与 server 的 runtime scheduler 都会
# 参与调度。只想跑其中一种模式时请显式指定服务名。

name: daily-stock-analysis

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped

  # 环境变量（从 .env 文件加载）。不要将 ../.env 作为单文件 volume 挂载到 /app/.env，
  # 否则 Docker mount point 会阻止配置保存时的 os.replace 原子更新。
  env_file:
    - ../.env

  # Web 设置页保存的配置写进容器内 /app/.env（容器层），**容器重建后丢失**，
  # 重启（restart）则仍在。实测：保存后容器内 /app/.env 有值，宿主 data/ 卷没有。
  # 需要跨重建持久化时，取消下面这行注释并同步更新宿主 .env 中的同名项——
  # 否则启动时的 env_file 仍会用旧值覆盖运行时文件里的新值。
  # environment:
  #   - ENV_FILE=/app/data/runtime.env

  volumes:
    - ../data:/app/data
    - ../logs:/app/logs
    - ../reports:/app/reports
    - ../strategies:/app/strategies:ro
    # Longbridge OAuth token cache persistence; entrypoint repairs container-side ownership for dsa user.
    # Create ../longbridge_tokens on the host before copying an authorized token cache into it.
    - ../longbridge_tokens:/home/dsa/.longbridge
    # 如需覆盖前端静态资源，可挂载本地 static 目录
    # - ../static:/app/static:ro

  environment:
    - TZ=Asia/Shanghai

    # Web/API service bind address (must be 0.0.0.0 inside container)
    - WEBUI_HOST=0.0.0.0
    # 端口注意：下面的 ${API_PORT:-8000} 属于 compose 变量插值，只读取
    # shell 环境变量或与本文件同目录的 docker/.env —— 根目录 .env 被 env_file
    # 注入进程环境，但**不参与插值**。改端口请用下面任一方式：
    #   API_PORT=9000 docker compose -f docker/docker-compose.yml up -d
    #   或在 docker/ 下建 .env 写 API_PORT=9000
    # 只改根目录 .env 里的 API_PORT 不会改变宿主机映射端口。

    # 代理设置（如果需要）
    # - http_proxy=http://host.docker.internal:10809
    # - https_proxy=http://host.docker.internal:10809
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  # 资源限制：完整分析建议 1G+；512M 仅适合轻量 Web/API、单股、低并发场景，
  # 且建议设置 MAX_WORKERS=1 并避免同时启动 analyzer 和 server。
  deploy:
    resources:
      limits:
        memory: 1G
      reservations:
        memory: 512M

services:
  # 定时任务模式
  analyzer:
    <<: *common
    container_name: stock-analyzer
    # 镜像内的探针已能识别「定时模式不监听 HTTP」并直接判健康，但那种健康
    # 检查对 analyzer 恒为通过、提供不了任何信息。这里显式关闭，避免制造
    # 「有监控」的假象；要观察 analyzer 是否存活请看日志或 restart 策略。
    healthcheck:
      disable: true
    # Docker 默认只等 10s 就 SIGKILL。analyzer 收到 SIGTERM 后会先等当前这轮
    # 分析跑完（src/scheduler.py 的 shutdown handler 语义），而一轮「多股票 +
    # 大盘复盘」实测可达数分钟；10s 必然不够，进程会被强杀，SQLite 的 WAL 来不及
    # checkpoint，存在丢事务/库损坏风险。给足宽限期让任务自然收尾。
    stop_grace_period: 300s

  # FastAPI 模式
  server:
    <<: *common
    container_name: stock-server
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}"]
    # 若使用 network_mode: host，则以下 ports 映射无效，端口由 command 中的 --port 指定
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    # serve-only 收到 SIGTERM 会优雅关闭（main.py 注册了信号处理并驱动 uvicorn
    # 走完 lifespan teardown）；实测约 3s。留 60s 余量覆盖在途请求与 SQLite 收尾。
    stop_grace_period: 60s
