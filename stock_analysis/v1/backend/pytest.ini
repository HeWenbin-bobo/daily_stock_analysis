[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers -m "not slow"
markers =
    slow: 慢速测试 (sleep 1s+, 用于 CI 过滤: -m "not slow")

# Coverage 配置
[coverage:run]
branch = true
source = services, llm, middlewares, routers
omit =
    */__pycache__/*
    */tests/*
    */.pytest_cache/*

[coverage:report]
# 总体覆盖率最低门槛 (CI 失败条件)
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    def __repr__
precision = 1
